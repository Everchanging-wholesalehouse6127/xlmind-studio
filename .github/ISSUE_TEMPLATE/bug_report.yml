name: Bug report
description: Report a reproducible problem with XLMind Studio
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        **Please do not post license keys, activation codes, order numbers, invoices, payment details, personal information or confidential workbooks.** Issues in this repository are public and permanently indexed.

        For licensing, billing or account questions, use the [support page](https://xlmindstudio.com/en/support) or email support@xlmindstudio.com instead.

        For a suspected security vulnerability, follow [SECURITY.md](https://github.com/bymmb/xlmind-studio/blob/main/SECURITY.md) instead of opening an issue.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: I have read the [troubleshooting guide](https://github.com/bymmb/xlmind-studio/blob/main/docs/troubleshooting.md).
          required: true
        - label: I downloaded XLMind Studio from the official website (xlmindstudio.com).
          required: true
        - label: This report contains no license keys, order numbers, personal data or confidential workbook content.
          required: true
  - type: input
    id: product-version
    attributes:
      label: XLMind Studio version
      description: Shown in the product.
      placeholder: "1.0.x"
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows version
      description: "Windows 11 23H2, Windows 10 22H2, Windows Server 2022, and so on."
      placeholder: "Windows 11 23H2"
    validations:
      required: true
  - type: input
    id: excel-version
    attributes:
      label: Microsoft Excel version and architecture
      description: "File > Account > About Excel. Please include 32-bit or 64-bit. XLMind Studio requires 64-bit desktop Excel on Windows."
      placeholder: "Microsoft 365 Apps for enterprise, Version 2406, 64-bit"
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: Which tool or ribbon group?
      placeholder: "XLMind Plus > Compare & Check > Compare Two Lists"
    validations:
      required: false
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead? Include the exact error text if there was one.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Describe the data shape using sample or anonymised data only.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots (optional)
      description: Drag images here. Please blur or remove any real customer, employee, financial or personal data first.
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Anything else? (optional)
      description: Approximate row and column counts, other add-ins in use, corporate policy restrictions, and so on.
    validations:
      required: false
